###########################################################################
###########################################################################
##
##  Docker Compose File: Seerr (https://github.com/seerr-team/seerr/blob/develop/docs/getting-started/docker.mdx)
##  Function: Front-end for Radarr/Sonarr
##
##  Documentation: https://github.com/seerr-team/seerr
##
###########################################################################
###########################################################################

  seerr:
    image: ghcr.io/seerr-team/seerr:develop
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TIMEZONE:?err}
    ports:
      - "${WEBUI_PORT_SEERR:?err}:5055"
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/seerr:/app/config
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "http://127.0.0.1:5055/api/v1/status",
          "-qO",
          "/dev/null",
        ]
      interval: 1m
      retries: 10    

