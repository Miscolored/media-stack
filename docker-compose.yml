version: "3.7"

services:

###########################################################################
###########################################################################
##
##  Docker Compose File: Bazarr (LinuxServer.io)
##  Function: Download subtitles for Radarr and Sonarr
##
##  Documentation: https://docs.linuxserver.io/images/docker-bazarr
##
###########################################################################
###########################################################################
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/bazarr:/config
      - ${FOLDER_FOR_MEDIA:?err}:/data
    ports:
      - "${WEBUI_PORT_BAZARR:?err}:6767"
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - DOCKER_MODS=ghcr.io/gilbn/theme.park:bazarr
      - TP_THEME=${TP_THEME:?err}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:6767/ping"]
      interval: 1m
      retries: 10

###########################################################################
###########################################################################
##
##    Docker Compose File: ByParr
##    Function: Anti-bot challenge solver
##
##    Documentation: https://github.com/ThePhaseless/Byparr
##
###########################################################################
###########################################################################

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    restart: unless-stopped

    ports:
      - "${BYPARR_PORT:?err}:8191"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8191"]
      interval: 1m
      retries: 10

###########################################################################
###########################################################################
##
##    Docker Compose File: DDNS-Updater (qmcgaw)
##    Function: Update Dynamic IP addresses for DNS A and/or AAAA records
##
##    Documentation: https://hub.docker.com/r/qmcgaw/ddns-updater
##
###########################################################################
###########################################################################
  ddns-updater:
    image: qmcgaw/ddns-updater:latest
    container_name: ddns-updater
    restart: always
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/ddns-updater:/updater/data
    ports:
      - ${WEBUI_PORT_DDNS_UPDATER:?err}:6500/tcp
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - CONFIG=
      - PERIOD=5m
      - UPDATE_COOLDOWN_PERIOD=5m
      - PUBLICIP_FETCHERS=all
      - PUBLICIP_HTTP_PROVIDERS=all
      - PUBLICIPV4_HTTP_PROVIDERS=all
      - PUBLICIPV6_HTTP_PROVIDERS=all
      - PUBLICIP_DNS_PROVIDERS=all
      - PUBLICIP_DNS_TIMEOUT=3s
      - HTTP_TIMEOUT=10s

      # Web UI
      - LISTENING_PORT=6500
      - ROOT_URL=/

      # Backup
      - BACKUP_PERIOD=0 # 0 to disable
      - BACKUP_DIRECTORY=/updater/data

      # Other
      - LOG_LEVEL=info
      - LOG_CALLER=hidden
      - SHOUTRRR_ADDRESSES=
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:6500"]
      interval: 1m
      retries: 10
###########################################################################
###########################################################################
##
##    Docker Compose File: Homarr
##    Function: Homepage
##
##    Documentation: https://homarr.dev/docs/getting-started/
##
###########################################################################
###########################################################################

  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/homarr:/appdata
    environment:
      - SECRET_ENCRYPTION_KEY=193cd33a82cc5f02233ab1b995320cf1826a9a50c648a17306622ff58115239a
    ports:
      - ${WEBUI_PORT_HOMARR:?err}:7575
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:7575"]
      interval: 1m
      retries: 10

###########################################################################
###########################################################################
##
##    Docker Compose File: Jackett (LinuxServer.io)
##    Function: Proxy for maintained searches.
##
##    Documentation: https://docs.linuxserver.io/images/docker-jackett/
##
###########################################################################
###########################################################################

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err} 
      - AUTO_UPDATE=true
      - RUN_OPTS=
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}:/config
      - ${FOLDER_FOR_MEDIA:?err}/blackhole:/downloads
    ports:
      - ${WEBUI_PORT_JACKETT:?err}:9117
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9117/"]
      interval: 1m
      retries: 10

###########################################################################
###########################################################################
##
##  Docker Compose File: Jellyfin (LinuxServer.io)
##  Function: Media Server
##
##  Documentation: https://jellyfin.org/docs/general/administration/installing#docker
##  https://jellyfin.org/docs/general/administration/hardware-acceleration/
##
###########################################################################
###########################################################################
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
# Add Configurations for GPU Hardware Rendering Here:
#    devices:
#      - /dev/dri/renderD128:/dev/dri/renderD128
#      - /dev/dri/card0:/dev/dri/card0
    volumes:
      - ${FOLDER_FOR_MEDIA:?err}:/data/media
      - ${FOLDER_FOR_CONFIGS:?err}/jellyfin:/config
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
#      - JELLYFIN_PublishedServerUrl=${LOCAL_DOCKER_IP:?err}  # Enable for DLNA - Only works on HOST Network Mode
    ports:
      - "${WEBUI_PORT_JELLYFIN:?err}:8096"
      - "${JELLYFIN_PORT_UDP:?err}:7359/udp"
      #- "1900:1900/udp" # TODO, required?
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8096/health"]
      interval: 1m
      retries: 10

