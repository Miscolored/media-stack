###########################################################################
###########################################################################
##
##  Docker Compose File: qBittorrent (LinuxServer.io)
##  Function: Torrent Download Client
##
##  Documentation: https://docs.linuxserver.io/images/docker-qbittorrent
##
###########################################################################
###########################################################################
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}:/config
      - ${FOLDER_FOR_MEDIA:?err}:/data
      - ${FOLDER_FOR_INCOMPLETE:?err}/torrent:/incomplete
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - WEBUI_PORT=8080
      - DOCKER_MODS=ghcr.io/gilbn/theme.park:qbittorrent
      - TP_THEME=${TP_THEME:?err}
      - TORRENTING_PORT=6881
    ports:
      - "${WEBUI_PORT_QBITTORRENT:?err}:8080"
      - "${QBIT_PORT_TCP:?err}:6881"
      - "${QBIT_PORT_UDP:?err}:6881/udp"
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "http://127.0.0.1:8080"]
      interval: 1m
      retries: 10      

